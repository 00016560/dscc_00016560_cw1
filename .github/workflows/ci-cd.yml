name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          python manage.py test

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dscc_00016560_cw1:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/dscc_00016560_cw1:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh ${{ secrets.USER }}@${{ secrets.HOST }} << 'ENDSSH'
            cd /opt/tickwise || exit 1
            
            echo "Pulling latest Docker image..."
            docker pull $DOCKER_USERNAME/dscc_00016560_cw1:latest
            
            echo "Stopping old containers..."
            docker compose down || docker-compose down
            
            echo "Starting new containers..."
            docker compose up -d || docker-compose up -d
            
            echo "Waiting for containers to be ready..."
            sleep 10
            
            echo "Running database migrations..."
            if command -v docker compose &> /dev/null; then
              docker compose exec -T web python manage.py migrate --noinput
              docker compose exec -T web python manage.py collectstatic --noinput
            else
              docker-compose exec -T web python manage.py migrate --noinput
              docker-compose exec -T web python manage.py collectstatic --noinput
            fi
            
            echo "Checking container status..."
            docker compose ps || docker-compose ps
            
            echo "Deployment completed successfully!"
          ENDSSH

      - name: Health check
        run: |
          sleep 5
          curl -f http://${{ secrets.HOST }}/health/ || echo "Health check endpoint not configured"